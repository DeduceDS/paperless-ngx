@if (customLogo) {
    <img src="{{customLogo}}" [class]="getClasses()" [attr.style]="'height:'+height" />
} @else {
    <!-- Fallback to centralized brand image for Deduce Data Solutions -->
    <img src="/images/DDS-white.webp" [class]="getClasses()" [attr.style]="'height:'+height" alt="Deduce Data Solutions logo" />
}
